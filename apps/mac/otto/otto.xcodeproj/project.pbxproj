			outputPaths = (
				"$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/binaries/otto-darwin-$(CURRENT_ARCH)",
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "set -euo pipefail\nexport PATH=\"$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH\"\nROOT=\"${SRCROOT}/../../..\"\nARCH=\"${CURRENT_ARCH:-}\"\nif [ -z \"$ARCH\" ] || [ \"$ARCH\" = \"undefined_arch\" ]; then\n  ARCH=\"${NATIVE_ARCH_ACTUAL:-$(uname -m)}\"\nfi\ncase \"$ARCH\" in\n  arm64) BIN=\"otto-darwin-arm64\"; SCRIPT=\"build:bin:darwin-arm64\" ;;\n  x86_64) BIN=\"otto-darwin-x64\"; SCRIPT=\"build:bin:darwin-x64\" ;;\n  *) echo \"error: unsupported architecture $ARCH for bundled otto CLI\"; exit 1 ;;\nesac\nSOURCE_BIN=\"$ROOT/dist/$BIN\"\nif [ ! -x \"$SOURCE_BIN\" ]; then\n  if ! command -v bun >/dev/null 2>&1; then\n    echo \"error: bun is required to build the bundled otto CLI\"\n    exit 1\n  fi\n  (cd \"$ROOT\" && bun run \"$SCRIPT\")\nfi\nDEST_DIR=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/binaries\"\nDEST_BIN=\"$DEST_DIR/$BIN\"\nmkdir -p \"$DEST_DIR\"\ncp \"$SOURCE_BIN\" \"$DEST_BIN\"\nchmod 755 \"$DEST_BIN\"\nif [ \"${CODE_SIGNING_ALLOWED:-NO}\" = \"YES\" ] && [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ] && [ \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" != \"-\" ]; then\n  SIGN_ARGS=(--force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\")\n  if [ \"${ENABLE_HARDENED_RUNTIME:-NO}\" = \"YES\" ]; then\n    SIGN_ARGS+=(--options runtime)\n  fi\n  case \"${EXPANDED_CODE_SIGN_IDENTITY_NAME:-}\" in\n    \"Developer ID Application:\"*) SIGN_ARGS+=(--timestamp) ;;\n    *) SIGN_ARGS+=(--timestamp=none) ;;\n  esac\n  codesign \"${SIGN_ARGS[@]}\" --entitlements \"$SRCROOT/otto/otto.entitlements\" \"$DEST_BIN\"\nfi\n";
		};
/* End PBXShellScriptBuildPhase section */

