[package]
name = "otto-desktop"
version = "0.1.0"
description = "otto desktop - AI-powered development assistant"
authors = ["nitishxyz"]
edition = "2021"

[lib]
name = "otto_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (for GitHub API) - base features only, TLS backend added per-platform below
reqwest = { version = "0.12", features = ["json"] }

# Utils
anyhow = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
semver = "1"
fontdb = "0.23"
base64 = "0.22"
libghostty-vt = { version = "0.2.1", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
glyphon = "0.12.0"
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl"] }

rand = "0.8"

# macOS/Linux: vendored OpenSSL for TLS
[target.'cfg(not(target_os = "windows"))'.dependencies]
reqwest = { version = "0.12", features = ["native-tls-vendored"] }
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30.0.0", default-features = false, features = ["vulkan", "gles"] }

# macOS: local focused-window Globe/Fn key handling for dictation.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
mac-notification-sys = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSWindow", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "objc2-app-kit", "block2"] }
wgpu = { version = "30.0.0", default-features = false, features = ["metal"] }

# Windows: use native SChannel TLS (no OpenSSL/Perl needed)
[target.'cfg(target_os = "windows")'.dependencies]
reqwest = { version = "0.12", features = ["native-tls"] }
wgpu = { version = "30.0.0", default-features = false, features = ["dx12"] }
