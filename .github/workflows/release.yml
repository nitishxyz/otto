          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update launcher-latest release with latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view launcher-latest >/dev/null 2>&1; then
            git tag -f launcher-latest
            git push -f origin launcher-latest
            gh release create launcher-latest \
              --title "Launcher Latest (auto-updater)" \
              --notes "This release is used by the auto-updater. Do not delete." \
              --prerelease
          fi
          gh release upload launcher-latest ./release/latest.json --clobber

  reset-flags:
    needs: [check-flags, publish-npm, publish-desktop, build-canvas, publish-launcher]
    if: always() && needs.check-flags.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest branch tip
        shell: bash
        run: |
          git fetch origin
          git checkout "${{ github.ref_name }}"
          git pull --ff-only origin "${{ github.ref_name }}"

      - name: Reset publish flags
        shell: bash
        run: |
          CHANGED=false

          if [ "${{ needs.check-flags.outputs.publish_cli }}" = "true" ]; then
            echo "CLI publish result: ${{ needs.publish-npm.result }}"
            sed -i 's/^PUBLISH_CLI=true$/PUBLISH_CLI=false/' publish.env
            CHANGED=true
          fi

          if [ "${{ needs.check-flags.outputs.publish_desktop }}" = "true" ]; then
            echo "Desktop publish result: ${{ needs.publish-desktop.result }}"
            sed -i 's/^PUBLISH_DESKTOP=true$/PUBLISH_DESKTOP=false/' publish.env
            CHANGED=true
          fi

          if [ "${{ needs.check-flags.outputs.publish_canvas }}" = "true" ]; then
            echo "Canvas build result: ${{ needs.build-canvas.result }}"
            sed -i 's/^PUBLISH_CANVAS=true$/PUBLISH_CANVAS=false/' publish.env
            CHANGED=true
          fi

          if [ "${{ needs.check-flags.outputs.publish_launcher }}" = "true" ]; then
            echo "Launcher publish result: ${{ needs.publish-launcher.result }}"
            sed -i 's/^PUBLISH_LAUNCHER=true$/PUBLISH_LAUNCHER=false/' publish.env
            CHANGED=true
          fi

          if [ "$CHANGED" = "true" ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add publish.env
            git commit -m "chore: reset publish flags [skip ci]" || echo "No changes to commit"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${{ github.ref_name }}" && git push origin "${{ github.ref_name }}" && break
              echo "Push failed (attempt $i), retrying in 5s..."
              sleep 5
            done
          fi
