name: Publish From Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g., v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  build-binaries-from-tag:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: darwin
            arch: x64
            runner: macos-15-intel
          - os: darwin
            arch: arm64
            runner: macos-14
          - os: linux
            arch: x64
            runner: ubuntu-22.04
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install deps
        run: bun install

      - name: Install Whisper build dependencies (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Install Whisper build dependencies (macOS)
        if: matrix.os == 'darwin'
        shell: bash
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Build platform binary
        shell: bash
        env:
          OTTO_REQUIRE_EMBEDDED_WHISPER: "1"
        run: |
          set -euo pipefail
          cd apps/cli
          case "${{ matrix.os }}-${{ matrix.arch }}" in
            darwin-arm64)
              bun run build:darwin-arm64
              ;;
            darwin-x64)
              bun run build:darwin-x64
              ;;
            linux-x64)
              bun run build:linux-x64
              ;;
            linux-arm64)
              bun run build:linux-arm64
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: otto-${{ matrix.os }}-${{ matrix.arch }}
          path: apps/cli/dist/otto-${{ matrix.os }}-${{ matrix.arch }}

  github-release-from-tag:
    needs: build-binaries-from-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p ./release
          find ./artifacts -type f -exec cp {} ./release/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: "otto ${{ github.event.inputs.tag }}"
          body: |
            Prebuilt binaries for ${{ github.event.inputs.tag }}.
          files: ./release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm-from-tag:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    needs: [github-release-from-tag]
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Configure npm auth
        if: ${{ env.NPM_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          printf "//registry.npmjs.org/:_authToken=%s\n" "$NPM_TOKEN" > .npmrc
          echo "always-auth=true" >> .npmrc

      - name: Verify token and versions match
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM_TOKEN is not set; cannot publish" >&2
            exit 1
          fi
          TAG="${{ github.event.inputs.tag }}"
          INSTALL_VERSION=$(jq -r .version packages/install/package.json)
          API_VERSION=$(jq -r .version packages/api/package.json)
          SDK_VERSION=$(jq -r .version packages/sdk/package.json)
          WEBUI_VERSION=$(jq -r .version packages/web-ui/package.json)
          WEBSDK_VERSION=$(jq -r .version packages/web-sdk/package.json)
          DATABASE_VERSION=$(jq -r .version packages/database/package.json)
          THEMES_VERSION=$(jq -r .version packages/themes/package.json)
          SERVER_VERSION=$(jq -r .version packages/server/package.json)
          
          if [ "v${INSTALL_VERSION}" != "$TAG" ]; then
            echo "Tag ($TAG) does not match install version (v${INSTALL_VERSION})" >&2
            exit 1
          fi
          
          if [ "${INSTALL_VERSION}" != "${API_VERSION}" ]; then
            echo "Install version (${INSTALL_VERSION}) does not match API version (${API_VERSION})" >&2
            echo "All packages should be updated to the same version" >&2
            exit 1
          fi
          
          if [ "${INSTALL_VERSION}" != "${SDK_VERSION}" ]; then
            echo "Install version (${INSTALL_VERSION}) does not match SDK version (${SDK_VERSION})" >&2
            echo "All packages should be updated to the same version" >&2
            exit 1
          fi
          
          if [ "${INSTALL_VERSION}" != "${WEBUI_VERSION}" ]; then
            echo "Install version (${INSTALL_VERSION}) does not match web-ui version (${WEBUI_VERSION})" >&2
            echo "All packages should be updated to the same version" >&2
            exit 1
          fi
          
          if [ "${INSTALL_VERSION}" != "${WEBSDK_VERSION}" ]; then
            echo "Install version (${INSTALL_VERSION}) does not match web-sdk version (${WEBSDK_VERSION})" >&2
            echo "All packages should be updated to the same version" >&2
            exit 1
          fi
          
          if [ "${INSTALL_VERSION}" != "${DATABASE_VERSION}" ]; then
            echo "Install version (${INSTALL_VERSION}) does not match database version (${DATABASE_VERSION})" >&2
            echo "All packages should be updated to the same version" >&2
            exit 1
          fi
          
          if [ "${INSTALL_VERSION}" != "${THEMES_VERSION}" ]; then
            echo "Install version (${INSTALL_VERSION}) does not match themes version (${THEMES_VERSION})" >&2
            echo "All packages should be updated to the same version" >&2
            exit 1
          fi
          
          if [ "${INSTALL_VERSION}" != "${SERVER_VERSION}" ]; then
            echo "Install version (${INSTALL_VERSION}) does not match server version (${SERVER_VERSION})" >&2
            echo "All packages should be updated to the same version" >&2
            exit 1
          fi
          
          echo "✓ Tag matches install version: ${INSTALL_VERSION}"
          echo "✓ API version: ${API_VERSION}"
          echo "✓ SDK version: ${SDK_VERSION}"
          echo "✓ Web UI version: ${WEBUI_VERSION}"
          echo "✓ Web SDK version: ${WEBSDK_VERSION}"
          echo "✓ Database version: ${DATABASE_VERSION}"
          echo "✓ Themes version: ${THEMES_VERSION}"
          echo "✓ Server version: ${SERVER_VERSION}"

      - name: Replace workspace dependencies
        shell: bash
        run: |
          bun run scripts/prepare-publish.ts

      - name: Regenerate clean lockfile
        shell: bash
        run: |
          rm -f bun.lock
          bun install

      - name: Publish install package to npm
        shell: bash
        run: |
          set -euo pipefail
          cd packages/install
          # Publish install package
          bun publish --access public --tag latest

      - name: Publish API to npm
        shell: bash
        run: |
          set -euo pipefail
          cd packages/api
          # Publish API package
          bun publish --access public --tag latest

      - name: Publish SDK to npm
        shell: bash
        run: |
          set -euo pipefail
          cd packages/sdk
          # Publish SDK package
          bun publish --access public --tag latest

      - name: Publish themes to npm
        shell: bash
        run: |
          set -euo pipefail
          cd packages/themes
          # Publish themes package
          bun publish --access public --tag latest

      - name: Publish web-sdk to npm
        shell: bash
        run: |
          set -euo pipefail
          cd packages/web-sdk
          # Publish web-sdk package
          bun publish --access public --tag latest

      - name: Publish web-ui to npm
        shell: bash
        run: |
          set -euo pipefail
          cd packages/web-ui
          # Publish web-ui package
          bun publish --access public --tag latest

      - name: Publish database to npm
        shell: bash
        run: |
          set -euo pipefail
          cd packages/database
          # Publish database package
          bun publish --access public --tag latest

      - name: Publish server to npm
        shell: bash
        run: |
          set -euo pipefail
          cd packages/server
          # Publish server package
          bun publish --access public --tag latest
